{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Network Routes API | Swagger</title>
    <link rel="icon" href="{% static 'drf_spectacular_sidecar/swagger-ui-dist/favicon-32x32.png' %}">
    <link rel="stylesheet" href="{% static 'drf_spectacular_sidecar/swagger-ui-dist/swagger-ui.css' %}">
  </head>
  <body>
    <div id="swagger-ui"></div>
    <noscript>Enable JavaScript to use Swagger UI. The schema is available at <a href="{% url 'openapi-schema' %}">openapi.json</a>.</noscript>
    <script src="{% static 'drf_spectacular_sidecar/swagger-ui-dist/swagger-ui-bundle.js' %}"></script>
    <script>
      window.ui = SwaggerUIBundle({
        url: "{% url 'openapi-schema' %}",
        dom_id: "#swagger-ui",
        deepLinking: true,
        filter: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        displayRequestDuration: true,
        supportedSubmitMethods: ["get", "post"],
        validatorUrl: null
      });
    </script>
  </body>
</html>
